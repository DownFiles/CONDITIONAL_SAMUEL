<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditional Quest</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🎮 CONDITIONAL QUEST</h1>

    <div id="info">
        ⭐ Score: <span id="score">0</span>
        | ❤️ Lives: <span id="lives">3</span>
    </div>

    <div id="game">

        <div id="player"></div>

        <div class="platform" id="p1"></div>
        <div class="platform" id="p2"></div>
        <div class="platform" id="p3"></div>
        <div class="platform" id="p4"></div>

        <div class="coin" id="coin1"></div>
        <div class="coin" id="coin2"></div>
        <div class="coin" id="coin3"></div>

        <div id="finish">🏆</div>

        <div id="questionBox">

            <h2>🧠 Conditional Challenge</h2>

            <div id="question"></div>

            <button class="answer" id="a1"></button>
            <button class="answer" id="a2"></button>
            <button class="answer" id="a3"></button>

            <div id="message"></div>

        </div>

    </div>

    <div class="controls">
        ⬅️ ➡️ Move &nbsp; | &nbsp; ⬆️ Jump
    </div>

    <br>

    <button id="restart" onclick="restartGame()">
        🔄 Restart Game
    </button>

    <script src="script.js"></script>

</body>
</html>
